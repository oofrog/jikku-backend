name: CI

# PR에서만 돈다. main 푸시는 Deploy 워크플로가 같은 검증을 먼저 수행하므로 여기서 또 돌릴 필요가 없다.
on:
  pull_request:

# 같은 PR에 새 커밋이 오면 진행 중이던 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 코드를 읽기만 하면 되는 잡이다. 저장소 기본값이 쓰기면 워크플로가 코드·이슈까지 건드릴 수 있어 좁혀 둔다.
permissions:
  contents: read

jobs:
  build:
    name: 빌드 & 테스트
    runs-on: ubuntu-latest

    steps:
      # 이후 단계가 Gradle 빌드뿐이라 git 인증을 쓸 일이 없다. 토큰을 .git/config에 남기지 않는다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 통합 테스트는 운영 Supabase·TourAPI에 실제로 붙어서 CI에서 제외한다.
      # 러너에 접속 정보를 주지 않는 쪽이 안전하고, 준다 해도 CI가 돌 때마다 운영 스키마가 바뀐다.
      - name: 빌드 & 유닛 테스트
        run: ./gradlew build -PexcludeTags=integration

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
