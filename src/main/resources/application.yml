spring:
  application:
    name: jikku-backend

  # 환경별로 갈리는 값만 application-{local,prod}.yml에 두고 나머지는 여기 공통으로 둔다.
  # 배포(Fly)에서는 SPRING_PROFILES_ACTIVE=prod가 이 기본값을 덮어쓴다.
  profiles:
    default: local

  # .env를 properties로 읽어 아래 ${} 자리표시자를 채운다. 이게 없으면 IDE의 EnvFile 플러그인이나
  # 셸 export에 의존하게 되어 터미널 실행이 깨진다. 배포 환경엔 .env 없이 진짜 환경변수만 있으므로 optional.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 엔티티에서 스키마 자동 생성, 기존 데이터는 안 건드림 (CLAUDE.md §2).
      # 엔티티 작업이 끝나면 validate로 내린다 — 그때부터 스키마는 Supabase에서만 관리한다.
      ddl-auto: update
    # show-sql은 프로필별로 갈린다 (local만 켬)

  servlet:
    multipart:
      max-file-size: 10MB       # ImageService의 검증값과 동일. 초과분은 컨트롤러 도달 전에 톰캣이 끊는다
      max-request-size: 12MB    # 파일 + 나머지 파트 합계

# CORS 허용 오리진. 브라우저는 스킴·호스트·포트가 하나라도 다르면 다른 오리진으로 보므로
# localhost와 127.0.0.1을 따로 적어야 하고, 프론트 dev 서버 포트(Next=3000, Vite=5173)도 각각 필요하다.
# 배포 환경에서는 CORS_ALLOWED_ORIGINS로 통째로 덮어쓴다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# TourAPI
tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}
  mobile-app: ${TOUR_API_MOBILE_APP}
  base-url: https://apis.data.go.kr/B551011

# JWT (자체 토큰). secret은 코드에 하드코딩 금지 → 환경변수 (CLAUDE.md §1-4)
jwt:
  secret: ${JWT_SECRET}                # HS256 서명키. 최소 32바이트(256bit) 이상이어야 함
  access-expiration: 3600000           # Access 토큰 만료(ms) = 1시간
  refresh-expiration: 1209600000       # Refresh 토큰 만료(ms) = 14일. 서버에 저장하지 않아 만료 전엔
                                       # 무효화할 수단이 없으므로 무한정 길게 잡지 않는다

# 카카오 로그인. JS SDK v2가 팝업 로그인(클라이언트 토큰 발급)을 없애 프론트는 인가 코드까지만 받는다.
# 코드→토큰 교환은 서버만 할 수 있고(REST 키 필요) 호스트가 kapi와 다르다.
kakao:
  api-base-url: https://kapi.kakao.com     # 사용자 정보 조회
  auth-base-url: https://kauth.kakao.com   # 토큰 발급
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET:}   # 콘솔에서 끄면 빈 값. 비어 있으면 요청에서 뺀다

# 개발용 로그인(POST /auth/dev-login) 보호키. 비어 있으면 해당 요청을 전부 거부한다(fail-closed).
dev-login:
  key: ${DEV_LOGIN_KEY:}

# Cloudflare R2 (S3 호환 스토리지)
r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket: ${R2_BUCKET}
  public-base-url: ${R2_PUBLIC_BASE_URL}   # 업로드된 객체를 읽을 공개 주소
