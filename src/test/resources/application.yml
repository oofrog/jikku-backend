spring:
  application:
    name: jikku-backend

  # 테스트 설정은 main의 application.yml을 대체하므로(병합 아님) 여기에도 같이 둬야 한다
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 엔티티에서 스키마 자동 생성, 기존 데이터는 안 건드림 (CLAUDE.md §2)
    show-sql: true              # 실행 SQL 콘솔 출력 (개발 편의)
    properties:
      hibernate:
        format_sql: true        # SQL 보기 좋게 포맷팅

  servlet:
    multipart:
      max-file-size: 10MB       # ImageService의 검증값과 동일. 초과분은 컨트롤러 도달 전에 톰캣이 끊는다
      max-request-size: 12MB    # 파일 + 나머지 파트 합계

# CORS 허용 오리진 (main과 동일. 이 파일이 main을 대체하므로 여기에도 있어야 컨텍스트가 뜬다)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# TourAPI
tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}
  mobile-app: ${TOUR_API_MOBILE_APP}
  base-url: https://apis.data.go.kr/B551011

# JWT (자체 토큰). secret은 코드에 하드코딩 금지 → 환경변수 (CLAUDE.md §1-4)
jwt:
  secret: ${JWT_SECRET}                # HS256 서명키. 최소 32바이트(256bit) 이상이어야 함
  access-expiration: 3600000           # Access 토큰 만료(ms) = 1시간 (main과 동일)
  refresh-expiration: 1209600000       # Refresh 토큰 만료(ms) = 14일

# 카카오 로그인 (main과 동일). 키는 실제 호출을 하지 않는 테스트라 더미 기본값을 둔다
kakao:
  api-base-url: https://kapi.kakao.com
  auth-base-url: https://kauth.kakao.com
  rest-api-key: ${KAKAO_REST_API_KEY:test-rest-api-key}
  client-secret: ${KAKAO_CLIENT_SECRET:}

# 개발용 로그인 보호키 (main과 동일. 비어 있으면 거부)
dev-login:
  key: ${DEV_LOGIN_KEY:}

# Cloudflare R2 (S3 호환 스토리지)
r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket: ${R2_BUCKET}
  public-base-url: ${R2_PUBLIC_BASE_URL}   # 업로드된 객체를 읽을 공개 주소
